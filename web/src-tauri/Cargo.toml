[package]
name = "skillhub-desktop"
version = "0.1.0"
description = "SkillHub desktop client — one-click install skills to local agents"
edition = "2021"
rust-version = "1.75"

[lib]
name = "skillhub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Filesystem home resolution (cross-platform macOS / Windows)
dirs = "5"
# HTTP download of skill zips from the registry
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Cross-platform zip extraction (no dependency on the system `unzip`)
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
